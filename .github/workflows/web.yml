# Builds the website version of CricCorner and publishes it on GitHub Pages.
# One-time setup: repo Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Publish web app
on:
  push:
    branches: [main, sdk54-upgrade]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install packages
        run: npm ci || npm install
      - name: Add the web packages
        run: npx expo install react-dom react-native-web @expo/metro-runtime
      - name: Prepare app.json for the web
        run: node scripts/web-config.js "${{ github.event.repository.name }}"
      - name: Build the website
        run: npx expo export -p web
      - name: Make it installable
        run: node scripts/web-post.js "${{ github.event.repository.name }}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
